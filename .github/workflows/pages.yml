name: Deploy Sirio Árbol to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html mobile-pan.js branch-graph.js interaction-fix.js _site/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          fix='''<style id="sirio-navigation-selection-fix">#treeViewport,#treeViewport *,#familyView,#familyView *{-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important}#treeViewport{cursor:grab}#treeViewport:active{cursor:grabbing}#surname{-webkit-user-select:text!important;user-select:text!important}</style>'''
          s=s.replace('</head>',fix+'</head>')
          s=s.replace('</body>','<script src="mobile-pan.js"></script><script src="branch-graph.js"></script><script src="interaction-fix.js"></script></body>')
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
